apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prime-clone
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-org/devops-project2.git   # <-- your repo
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: prime-clone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
